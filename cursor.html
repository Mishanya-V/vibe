<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Python Camp — полный курс Python</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    :root {
      --navy: #0a0a23;
      --navy-2: #1b1b32;
      --navy-3: #2a2a40;
      --gold: #f1be32;
      --gold-2: #ffbf00;
      --text: #f5f6f7;
      --muted: #9ca3af;
      --link: #99c9ff;
      --ok: #87b15b;
      --bad: #ff6b6b;
      --panel: #0c0c24;
      --border: #3b3b4f;
      --sidebar: 280px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--navy); color: var(--text); font-family: "Lato", "Segoe UI", sans-serif; }
    a { color: var(--link); }
    button { font-family: inherit; cursor: pointer; }
    #app { height: 100%; display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 16px; padding: 0 16px;
      height: 52px; background: var(--navy); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .3px; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 6px; background: var(--gold); color: #0a0a23;
      display: grid; place-items: center; font-weight: 900; font-size: 16px;
    }
    .spacer { flex: 1; }
    .progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 180px; }
    .bar { height: 8px; background: var(--navy-3); border-radius: 99px; overflow: hidden; flex: 1; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--gold); }
    .top-btn {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 4px; font-size: 13px;
    }
    .top-btn:hover { background: var(--navy-3); }
    .gold { background: var(--gold); color: #0a0a23; border: 0; font-weight: 700; }
    .gold:hover { filter: brightness(1.05); }
    .layout { flex: 1; display: grid; grid-template-columns: var(--sidebar) 1fr 1fr; min-height: 0; }
    aside {
      background: var(--navy-2); border-right: 1px solid var(--border); overflow: auto; padding: 12px 0 32px;
    }
    .sec-title {
      padding: 14px 16px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--gold); font-weight: 700;
    }
    .lesson {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: transparent; border: 0; color: var(--text); padding: 8px 16px; font-size: 13px;
    }
    .lesson:hover { background: #23233b; }
    .lesson.active { background: #3b3b4f; border-left: 3px solid var(--gold); padding-left: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; }
    .dot.done { background: var(--ok); border-color: var(--ok); }
    .mid, .right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .mid { background: var(--panel); border-right: 1px solid var(--border); }
    .pane-head {
      height: 42px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted);
    }
    .theory { flex: 1; overflow: auto; padding: 22px 24px 48px; line-height: 1.65; }
    .theory h1 { font-size: 28px; margin: 0 0 12px; }
    .theory h2 { font-size: 18px; margin: 22px 0 8px; color: var(--gold); }
    .theory p { margin: 0 0 12px; color: #d9dbe0; }
    .theory ul { margin: 0 0 12px; padding-left: 20px; color: #d9dbe0; }
    .theory code, .inline {
      font-family: Consolas, "Courier New", monospace; background: #1b1b32; padding: 1px 6px; border-radius: 4px;
      color: #f8dfa0;
    }
    .theory pre {
      background: #1b1b32; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
      overflow: auto; font-family: Consolas, "Courier New", monospace; font-size: 13px; color: #e8eaed;
    }
    .hint { background: #22223a; border-left: 4px solid var(--gold); padding: 10px 12px; margin: 16px 0; border-radius: 0 8px 8px 0; }
    .editor-wrap { flex: 1; min-height: 180px; }
    #editor { width: 100%; height: 100%; }
    .console {
      height: 34%; min-height: 140px; border-top: 1px solid var(--border); display: flex; flex-direction: column; background: #010113;
    }
    .console-out {
      flex: 1; overflow: auto; padding: 10px 12px; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap;
    }
    .tests { padding: 8px 12px; border-top: 1px solid var(--border); overflow: auto; max-height: 45%; }
    .test-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 6px 0; }
    .pill { font-size: 11px; padding: 2px 6px; border-radius: 99px; font-weight: 700; }
    .pill.pass { background: #1e3a1e; color: #b6e388; }
    .pill.fail { background: #3a1e1e; color: #ff9a9a; }
    .pill.wait { background: #2a2a40; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .run {
      background: #002ead; color: white; border: 0; padding: 6px 12px; border-radius: 4px; font-weight: 700; font-size: 13px;
    }
    .check {
      background: var(--ok); color: #0a0a23; border: 0; padding: 6px 12px; border-radius: 4px; font-weight: 800; font-size: 13px;
    }
    .nav-lesson { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
    .nav-lesson button { flex: 1; background: var(--navy-3); color: white; border: 0; padding: 10px; border-radius: 4px; }
    .overlay {
      position: fixed; inset: 0; background: rgba(4,4,16,.72); display: none; place-items: center; z-index: 20; padding: 24px;
    }
    .overlay.show { display: grid; }
    .modal {
      background: var(--navy-2); border: 1px solid var(--border); border-radius: 12px; max-width: 920px; width: 100%;
      max-height: 86vh; overflow: auto; padding: 22px;
    }
    .map-grid { display: grid; gap: 16px; }
    .map-sec { background: var(--navy); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: var(--navy-3); border: 0; color: white; font-size: 12px; padding: 6px 8px; border-radius: 6px;
    }
    .chip.done { outline: 1px solid var(--ok); }
    .cert {
      text-align: center; border: 6px double var(--gold); padding: 40px 24px; background: linear-gradient(180deg, #14142a, #0a0a23);
    }
    .cert h1 { color: var(--gold); margin: 8px 0 4px; }
    #status { font-size: 12px; color: var(--muted); }
    .loader { color: var(--gold); font-size: 13px; }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; }
      aside { max-height: 180px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo"><span class="logo-mark">&lt;/&gt;</span> Python Camp</div>
      <div class="spacer"></div>
      <span id="status" class="loader">Загрузка Python…</span>
      <div class="progress-wrap" title="Прогресс курса">
        <div class="bar"><i id="bar"></i></div>
        <span id="pct">0%</span>
      </div>
      <button class="top-btn" id="btn-map">Карта курса</button>
      <button class="top-btn" id="btn-reset">Сброс</button>
    </header>
    <div class="layout">
      <aside id="sidebar"></aside>
      <section class="mid">
        <div class="pane-head"><span id="crumb">Урок</span><span id="lesson-num"></span></div>
        <article class="theory" id="theory"></article>
        <div class="nav-lesson">
          <button id="prev">← Назад</button>
          <button id="next">Дальше →</button>
        </div>
      </section>
      <section class="right">
        <div class="pane-head">
          <span>Редактор Python</span>
          <div class="actions">
            <button class="run" id="run">▶ Запустить</button>
            <button class="check" id="check">Проверить код</button>
          </div>
        </div>
        <div class="editor-wrap"><div id="editor"></div></div>
        <div class="console">
          <div class="pane-head" style="height:32px"><span>Консоль и тесты</span><span>Ctrl+Enter — запуск</span></div>
          <div class="console-out" id="out">Готово к работе.</div>
          <div class="tests" id="tests"></div>
        </div>
      </section>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

<script>
const STORAGE = "python-camp-v1";
const COURSE = [
  {
    id: "intro",
    title: "1. Введение в Python",
    lessons: [
      {
        id: "what-is-python",
        title: "Что такое Python",
        theory: `<h1>Что такое Python</h1>
<p>Python — язык общего назначения: на нём пишут веб-сервисы, анализ данных, автоматизацию, нейросети и скрипты. Его ценят за читаемый синтаксис: блоки кода задаются отступами, а не скобками.</p>
<h2>Зачем этот курс</h2>
<p>Вы пройдёте путь как на freeCodeCamp: короткое объяснение, пример, задание в редакторе справа и автопроверки. Прогресс сохраняется в браузере.</p>
<ul>
<li>Пишите код в редакторе справа.</li>
<li>Кнопка <b>Запустить</b> показывает вывод <code>print</code>.</li>
<li><b>Проверить код</b> гоняет скрытые тесты. Если все зелёные — урок засчитан.</li>
</ul>
<div class="hint">Задание: выведите строку <code>Python Camp</code> функцией print.</div>`,
        starter: `print("Python Camp")\n`,
        tests: [
          { py: "assert 'Python Camp' in OUTPUT", ok: "В выводе есть Python Camp" }
        ]
      },
      {
        id: "hello-world",
        title: "Hello, World!",
        theory: `<h1>Hello, World!</h1>
<p>Первая программа на любом языке печатает приветствие. В Python это одна строка:</p>
<pre>print("Hello, World!")</pre>
<p><code>print</code> — встроенная функция. Аргумент в кавычках — строка. Одинарные и двойные кавычки равносильны.</p>
<div class="hint">Напечатайте ровно <code>Hello, World!</code></div>`,
        starter: `print("Hello")\n`,
        tests: [
          { py: "assert OUTPUT.strip() == 'Hello, World!'", ok: "Вывод точно Hello, World!" }
        ]
      },
      {
        id: "comments",
        title: "Комментарии",
        theory: `<h1>Комментарии</h1>
<p>Комментарий начинается с <code>#</code> и игнорируется интерпретатором. Им объясняют намерение, а не пересказывают очевидное.</p>
<pre># Это комментарий
print(1)  # комментарий в конце строки</pre>
<p>Многострочные пояснения часто пишут несколькими <code>#</code> или строками в тройных кавычках — последние ещё используют как документацию функций.</p>
<div class="hint">Оставьте комментарий с текстом TODO и напечатайте число 42.</div>`,
        starter: `# напишите комментарий TODO\nprint(0)\n`,
        tests: [
          { py: "assert 'TODO' in USER_CODE", ok: "В коде есть комментарий TODO" },
          { py: "assert OUTPUT.strip() == '42'", ok: "Напечатано 42" }
        ]
      },
      {
        id: "print-args",
        title: "print с несколькими аргументами",
        theory: `<h1>Несколько аргументов print</h1>
<p>Можно передать несколько значений — по умолчанию они разделяются пробелом:</p>
<pre>print("год", 2026)
print("a", "b", sep="-")
print("строка", end="!")</pre>
<p><code>sep</code> меняет разделитель, <code>end</code> — чем заканчивается строка (по умолчанию перевод строки).</p>
<div class="hint">Напечатайте <code>A-B-C</code> одним вызовом print, используя sep.</div>`,
        starter: `print("A", "B", "C")\n`,
        tests: [
          { py: "assert OUTPUT.strip() == 'A-B-C'", ok: "Вывод A-B-C" },
          { py: "assert 'sep' in USER_CODE", ok: "Использован аргумент sep" }
        ]
      },
      {
        id: "syntax-errors",
        title: "Ошибки синтаксиса",
        theory: `<h1>Ошибки</h1>
<p>Пока вы учитесь, ошибки — нормальный сигнал. Типичные:</p>
<ul>
<li><code>SyntaxError</code> — опечатка, забытая кавычка, неверные отступы.</li>
<li><code>NameError</code> — имя не определено.</li>
<li><code>TypeError</code> — операция к неподходящему типу, например сложение числа и строки без преобразования.</li>
</ul>
<p>Читайте последнюю строку трассировки: там тип и сообщение.</p>
<div class="hint">Исправьте код так, чтобы он печатал сумму 2 и 3, то есть 5.</div>`,
        starter: `print(2 + "3")\n`,
        tests: [
          { py: "assert ERROR is None", ok: "Код выполняется без ошибки" },
          { py: "assert OUTPUT.strip() == '5'", ok: "Напечатано 5" }
        ]
      }
    ]
  },
  {
    id: "vars",
    title: "2. Переменные и типы",
    lessons: [
      {
        id: "variables",
        title: "Переменные",
        theory: `<h1>Переменные</h1>
<p>Имя связывается со значением оператором <code>=</code>. Это не уравнение из математики, а присваивание.</p>
<pre>score = 10
score = score + 5  # теперь 15</pre>
<p>Имена: буквы, цифры, подчёркивание; не начинают с цифры. Стиль Python — <code>snake_case</code>.</p>
<div class="hint">Создайте переменную <code>language</code> со значением <code>"Python"</code> и напечатайте её.</div>`,
        starter: `language = ""\nprint(language)\n`,
        tests: [
          { py: "assert ns.get('language') == 'Python'", ok: "language == 'Python'" },
          { py: "assert 'Python' in OUTPUT", ok: "Python напечатан" }
        ]
      },
      {
        id: "types",
        title: "Основные типы",
        theory: `<h1>Типы данных</h1>
<p>Базовые встроенные типы:</p>
<ul>
<li><code>int</code> — целые: 0, -3, 42</li>
<li><code>float</code> — с точкой: 3.14, -0.5</li>
<li><code>str</code> — текст</li>
<li><code>bool</code> — <code>True</code> и <code>False</code></li>
<li><code>None</code> — «нет значения»</li>
</ul>
<pre>print(type(3))        # &lt;class 'int'&gt;
print(type(3.0))      # &lt;class 'float'&gt;
print(type("3"))      # &lt;class 'str'&gt;</pre>
<div class="hint">Задайте <code>age</code> как int, <code>height</code> как float, <code>name</code> как str, <code>active</code> как bool.</div>`,
        starter: `age = None\nheight = None\nname = None\nactive = None\n`,
        tests: [
          { py: "assert type(ns['age']) is int", ok: "age — int" },
          { py: "assert type(ns['height']) is float", ok: "height — float" },
          { py: "assert type(ns['name']) is str", ok: "name — str" },
          { py: "assert type(ns['active']) is bool", ok: "active — bool" }
        ]
      },
      {
        id: "casting",
        title: "Приведение типов",
        theory: `<h1>Приведение типов</h1>
<p>Функции <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code> создают новое значение другого типа.</p>
<pre>int("12")      # 12
float("3.5")   # 3.5
str(100)       # "100"
int(3.9)       # 3 — дробная часть отбрасывается</pre>
<p>Складывать число и строку нельзя: сначала приведите к одному типу.</p>
<div class="hint"><code>year</code> — строка "2026". Сделайте целое <code>year_num</code> и строку <code>label</code> вида Year: 2026.</div>`,
        starter: `year = "2026"\nyear_num = year\nlabel = year\n`,
        tests: [
          { py: "assert ns['year_num'] == 2026 and type(ns['year_num']) is int", ok: "year_num это int 2026" },
          { py: "assert ns['label'] == 'Year: 2026'", ok: "label == 'Year: 2026'" }
        ]
      },
      {
        id: "multiple-assign",
        title: "Множественное присваивание",
        theory: `<h1>Несколько имён сразу</h1>
<pre>a, b = 1, 2
x = y = 0
a, b = b, a  # обмен без третьей переменной</pre>
<p>Число имён слева должно совпадать с числом значений справа, иначе <code>ValueError</code>.</p>
<div class="hint">Задайте <code>first, second = "Py", "thon"</code>, затем <code>word = first + second</code>.</div>`,
        starter: `first = ""\nsecond = ""\nword = ""\n`,
        tests: [
          { py: "assert ns['first'] == 'Py' and ns['second'] == 'thon'", ok: "first и second заданы" },
          { py: "assert ns['word'] == 'Python'", ok: "word == 'Python'" }
        ]
      }
    ]
  },
  {
    id: "strings",
    title: "3. Строки",
    lessons: [
      {
        id: "index-slice",
        title: "Индексы и срезы",
        theory: `<h1>Индексы и срезы</h1>
<p>Символы нумеруются с нуля. Отрицательный индекс считает с конца: <code>-1</code> — последний символ.</p>
<pre>s = "Python"
s[0]      # 'P'
s[-1]     # 'n'
s[0:2]    # 'Py'
s[2:]     # 'thon'
s[::-1]   # разворот</pre>
<p>Срез <code>s[start:stop]</code> не включает <code>stop</code>. Строки неизменяемы: нельзя написать <code>s[0] = "p"</code>.</p>
<div class="hint">Для <code>text = "JavaScript"</code> получите <code>first = "J"</code>, <code>last = "t"</code>, <code>core = "Script"</code>.</div>`,
        starter: `text = "JavaScript"\nfirst = text\nlast = text\ncore = text\n`,
        tests: [
          { py: "assert ns['first'] == 'J'", ok: "first — первый символ" },
          { py: "assert ns['last'] == 't'", ok: "last — последний" },
          { py: "assert ns['core'] == 'Script'", ok: "core == 'Script'" }
        ]
      },
      {
        id: "str-methods",
        title: "Методы строк",
        theory: `<h1>Методы строк</h1>
<p>Метод вызывается через точку. Он возвращает новую строку, оригинал не меняет.</p>
<pre>"hello".upper()           # HELLO
"HELLO".lower()
"  hi  ".strip()
"a,b,c".split(",")        # ['a','b','c']
"-".join(["a","b"])       # a-b
"hi".replace("h", "H")</pre>
<div class="hint">Из <code>raw = "  python CAMP  "</code> сделайте <code>clean = "Python camp"</code> (обрезать пробелы и нормализовать регистр: первая заглавная, остальные строчные).</div>`,
        starter: `raw = "  python CAMP  "\nclean = raw\n`,
        tests: [
          { py: "assert ns['clean'] == 'Python camp'", ok: "clean == 'Python camp'" }
        ]
      },
      {
        id: "fstrings",
        title: "f-строки",
        theory: `<h1>f-строки</h1>
<p>Перед кавычками ставят <code>f</code>, а выражения — в фигурные скобки. Это основной способ форматирования в современном Python.</p>
<pre>name = "Ada"
n = 3
f"{name} написала {n} программы"
f"{3.14159:.2f}"   # 3.14</pre>
<div class="hint">Даны <code>user</code> и <code>points</code>. Соберите <code>msg</code> вида <code>Ada: 120 pts</code> через f-строку.</div>`,
        starter: `user = "Ada"\npoints = 120\nmsg = user\n`,
        tests: [
          { py: "assert ns['msg'] == 'Ada: 120 pts'", ok: "Сообщение в нужном формате" },
          { py: "assert 'f\"' in USER_CODE or \"f'\" in USER_CODE", ok: "Использована f-строка" }
        ]
      },
      {
        id: "in-find",
        title: "Поиск в строке",
        theory: `<h1>in, find, count</h1>
<pre>"py" in "python"     # True
"python".find("th")  # 2, или -1 если нет
"banana".count("a")  # 3
"python".startswith("py")
"file.py".endswith(".py")</pre>
<p>Оператор <code>in</code> читается естественно: «содержится ли подстрока в строке».</p>

const LESSONS = COURSE.flatMap((s, si) => s.lessons.map((l, li) => ({ ...l, section: s.title, si, li })));

let pyodide = null;
let editor = null;
let idx = 0;
let completed = new Set();

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE) || "{}");
    completed = new Set(raw.completed || []);
    idx = Number.isInteger(raw.idx) ? raw.idx : 0;
  } catch (_) {}
}
function saveState() {
  localStorage.setItem(STORAGE, JSON.stringify({ completed: [...completed], idx }));
}

function renderSidebar() {
  const box = document.getElementById("sidebar");
  box.innerHTML = "";
  COURSE.forEach((sec) => {
    const h = document.createElement("div");
    h.className = "sec-title";
    const done = sec.lessons.filter((l) => completed.has(l.id)).length;
    h.textContent = `${sec.title} · ${done}/${sec.lessons.length}`;
    box.appendChild(h);
    sec.lessons.forEach((l) => {
      const b = document.createElement("button");
      b.className = "lesson" + (LESSONS[idx].id === l.id ? " active" : "");
      b.innerHTML = `<span class="dot ${completed.has(l.id) ? "done" : ""}"></span><span>${l.title}</span>`;
      b.onclick = () => { idx = LESSONS.findIndex((x) => x.id === l.id); openLesson(); };
      box.appendChild(b);
    });
  });
}

function openLesson() {
  const L = LESSONS[idx];
  document.getElementById("theory").innerHTML = L.theory;
  document.getElementById("crumb").textContent = L.section;
  document.getElementById("lesson-num").textContent = `${idx + 1} / ${LESSONS.length}`;
  editor.setValue(L.starter, -1);
  document.getElementById("out").textContent = "Готово к работе.";
  renderTests(L.tests.map(() => "wait"));
  if (L.id === "cert") {
    const n = completed.size;
    const el = document.getElementById("cert-stats");
    if (el) el.textContent = `Решено уроков: ${n} из ${LESSONS.length}`;
  }
  renderSidebar();
  updateProgress();
  saveState();
  document.querySelector(".lesson.active")?.scrollIntoView({ block: "nearest" });
}

function renderTests(states) {
  const L = LESSONS[idx];
  document.getElementById("tests").innerHTML = L.tests.map((t, i) => {
    const st = states[i] || "wait";
    const label = st === "pass" ? "PASS" : st === "fail" ? "FAIL" : "TEST";
    return `<div class="test-row"><span class="pill ${st}">${label}</span><span>${t.ok}</span></div>`;
  }).join("");
}

function updateProgress() {
  const p = Math.round((completed.size / LESSONS.length) * 100);
  document.getElementById("bar").style.width = p + "%";
  document.getElementById("pct").textContent = p + "%";
}

async function runUser(alsoTest) {
  if (!pyodide) {
    document.getElementById("out").textContent = "Python ещё загружается…";
    return;
  }
  const code = editor.getValue();
  const L = LESSONS[idx];
  document.getElementById("out").textContent = "Выполнение…";
  pyodide.globals.set("USER_CODE", code);
  pyodide.globals.set("TEST_SNIPPETS", alsoTest ? L.tests.map((t) => t.py) : []);
  try {
    const result = await Promise.race([
      pyodide.runPythonAsync(`
import json, sys, io, traceback
ns = {"__name__": "__main__"}
buf = io.StringIO()
err = None
old = sys.stdout
sys.stdout = buf
try:
    exec(compile(USER_CODE, "<user>", "exec"), ns)
except Exception:
    err = traceback.format_exc()
finally:
    sys.stdout = old
OUTPUT = buf.getvalue()
ERROR = err
results = []
tests = list(TEST_SNIPPETS)
if err is None:
    for t in tests:
        try:
            g = {"ns": ns, "OUTPUT": OUTPUT, "ERROR": ERROR, "USER_CODE": USER_CODE, "json": json}
            exec(compile(str(t), "<test>", "exec"), g)
            results.append({"ok": True})
        except Exception as e:
            results.append({"ok": False, "msg": str(e)})
else:
    results = [{"ok": False, "msg": "код не запустился"} for _ in tests]
json.dumps({"output": OUTPUT, "error": ERROR, "results": results})
      `),
      new Promise((_, rej) => setTimeout(() => rej(new Error("Таймаут 8с — возможный бесконечный цикл")), 8000))
    ]);
    const data = JSON.parse(result);
    let text = data.error ? data.error : (data.output || "(нет вывода)");
    document.getElementById("out").textContent = text;
    if (alsoTest) {
      const states = data.results.map((r) => r.ok ? "pass" : "fail");
      renderTests(states);
      const failed = data.results.filter((r) => !r.ok);
      if (data.error) {
        /* keep error */
      } else if (failed.length === 0 && L.tests.length) {
        completed.add(L.id);
        document.getElementById("out").textContent = text + "\n\n✓ Все тесты пройдены.";
        saveState();
        renderSidebar();
        updateProgress();
      } else if (failed.length) {
        document.getElementById("out").textContent = text + "\n\n✗ Есть ошибки тестов:\n" + failed.map((f) => f.msg).join("\n");
      }
    }
  } catch (e) {
    document.getElementById("out").textContent = String(e);
  }
}

function showMap() {
  const html = `<div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0">Карта курса</h2>
    <button class="top-btn" id="close-map">Закрыть</button>
  </div>
  <p style="color:var(--muted)">${completed.size} / ${LESSONS.length} уроков · как карта сертификаций freeCodeCamp</p>
  <div class="map-grid">${COURSE.map((s) => `<div class="map-sec"><strong>${s.title}</strong>
    <div class="chips">${s.lessons.map((l) => {
      const i = LESSONS.findIndex((x) => x.id === l.id);
      return `<button class="chip ${completed.has(l.id) ? "done" : ""}" data-i="${i}">${completed.has(l.id) ? "✓ " : ""}${l.title}</button>`;
    }).join("")}</div></div>`).join("")}</div>`;
  document.getElementById("modal").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("close-map").onclick = () => document.getElementById("overlay").classList.remove("show");
  document.getElementById("modal").querySelectorAll("[data-i]").forEach((b) => {
    b.onclick = () => {
      idx = Number(b.dataset.i);
      document.getElementById("overlay").classList.remove("show");
      openLesson();
    };
  });
}

async function main() {
  loadState();
  editor = ace.edit("editor");
  editor.setTheme("ace/theme/twilight");
  editor.session.setMode("ace/mode/python");
  editor.setOptions({ fontSize: 14, tabSize: 4, useSoftTabs: true, wrap: true });
  editor.commands.addCommand({
    name: "run",
    bindKey: { win: "Ctrl-Enter", mac: "Command-Enter" },
    exec: () => runUser(false)
  });
  document.getElementById("run").onclick = () => runUser(false);
  document.getElementById("check").onclick = () => runUser(true);
  document.getElementById("prev").onclick = () => { idx = Math.max(0, idx - 1); openLesson(); };
  document.getElementById("next").onclick = () => { idx = Math.min(LESSONS.length - 1, idx + 1); openLesson(); };
  document.getElementById("btn-map").onclick = showMap;
  document.getElementById("btn-reset").onclick = () => {
    if (confirm("Сбросить прогресс?")) {
      completed = new Set();
      idx = 0;
      saveState();
      openLesson();
    }
  };
  document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") e.target.classList.remove("show");
  });
  openLesson();
  try {
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    document.getElementById("status").textContent = "CPython 3.12 · Pyodide";
    document.getElementById("status").classList.remove("loader");
  } catch (e) {
    document.getElementById("status").textContent = "Не удалось загрузить Python (нужен интернет)";
  }
}
main();
</script>

</html>
