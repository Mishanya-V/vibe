<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — бесплатный курс Python</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel2:#1c2128;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --gold:#f0b429;
  --green:#3fb950;
  --red:#f85149;
  --blue:#58a6ff;
  --purple:#bc8cff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
  overflow:hidden;
}
button{font-family:inherit;}

/* ---------- HEADER ---------- */
header{
  height:56px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 18px;
  position:relative;
  z-index:30;
}
.logo{
  display:flex;align-items:center;gap:9px;
  font-weight:700;font-size:17px;white-space:nowrap;
  letter-spacing:-.3px;
}
.logo .mark{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--gold),#e07b00);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#1b1b32;font-weight:900;
}
.logo span.accent{color:var(--gold);}
.header-progress{
  flex:1;
  max-width:420px;
  display:flex;align-items:center;gap:12px;
  margin-left:auto;
}
.pbar{
  flex:1;height:8px;background:#0b0f14;border-radius:20px;overflow:hidden;
  border:1px solid var(--border);
}
.pbar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--green),#2ea043);
  transition:width .45s ease;
}
.pbar-text{font-size:12.5px;color:var(--muted);white-space:nowrap;}
.icon-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{color:var(--text);border-color:#4a5560;}

/* ---------- LAYOUT ---------- */
.app{
  display:flex;
  height:calc(100% - 56px);
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:308px;
  min-width:308px;
  background:var(--panel);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding-bottom:40px;
}
.sidebar::-webkit-scrollbar{width:9px;}
.sidebar::-webkit-scrollbar-thumb{background:#2b323b;border-radius:5px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}

.side-head{
  padding:16px 18px 10px;
  font-size:11.5px;
  letter-spacing:1.1px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}
.module{margin-bottom:4px;}
.module-title{
  padding:11px 18px;
  font-size:12.5px;
  font-weight:700;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:.7px;
  display:flex;align-items:center;gap:8px;
  cursor:pointer;
  user-select:none;
}
.module-title:hover{background:#1b212a;}
.module-title .arrow{
  font-size:9px;transition:transform .2s;color:var(--muted);
  display:inline-block;
}
.module.collapsed .arrow{transform:rotate(-90deg);}
.module.collapsed .lesson-list{display:none;}
.lesson-list{list-style:none;margin:0;padding:0;}
.lesson-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 18px 8px 26px;
  font-size:13.6px;
  color:#b9c2cc;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .12s,color .12s;
}
.lesson-item:hover{background:#1b212a;color:var(--text);}
.lesson-item.active{
  background:#1f2733;
  color:#fff;
  border-left-color:var(--gold);
  font-weight:600;
}
.lesson-item .status{
  width:17px;height:17px;min-width:17px;
  border-radius:50%;
  border:1.5px solid #3a424c;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:transparent;
}
.lesson-item.done .status{
  background:var(--green);border-color:var(--green);color:#0d1117;
  font-weight:900;
}

/* ---------- MAIN ---------- */
.main{
  flex:1;
  display:flex;
  overflow:hidden;
  min-width:0;
}

/* Theory panel */
.theory{
  width:46%;
  min-width:300px;
  overflow-y:auto;
  padding:30px 36px 90px;
  border-right:1px solid var(--border);
  background:var(--bg);
}
.theory::-webkit-scrollbar{width:10px;}
.theory::-webkit-scrollbar-thumb{background:#2b323b;border-radius:5px;}
.theory h2{
  font-size:24px;margin:0 0 6px;color:#fff;letter-spacing:-.4px;
  line-height:1.3;
}
.theory h3{
  font-size:16.5px;margin:26px 0 8px;color:var(--gold);
  letter-spacing:-.2px;
}
.theory p{margin:11px 0;color:#c6cfd8;}
.theory ul,.theory ol{margin:11px 0;padding-left:22px;color:#c6cfd8;}
.theory li{margin:5px 0;}
.theory code{
  background:#1f2630;
  border:1px solid #2d353f;
  padding:1.5px 6px;
  border-radius:5px;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:13px;
  color:#ffa657;
}
.theory pre{
  background:#0b0f14;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  overflow-x:auto;
  margin:14px 0;
  line-height:1.55;
}
.theory pre code{
  background:none;border:none;padding:0;color:#e6edf3;font-size:13px;
}
.theory strong{color:#fff;}
.theory .note{
  border-left:3px solid var(--blue);
  background:#0f1b2b;
  padding:11px 16px;
  border-radius:0 8px 8px 0;
  margin:16px 0;
  color:#a9c7e8;
  font-size:14px;
}
.theory .warn{
  border-left:3px solid var(--gold);
  background:#241d0c;
  padding:11px 16px;
  border-radius:0 8px 8px 0;
  margin:16px 0;
  color:#e8d5a9;
  font-size:14px;
}
.theory table{
  width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
}
.theory th,.theory td{
  border:1px solid var(--border);padding:7px 11px;text-align:left;
}
.theory th{background:#1a212b;color:var(--gold);font-weight:600;}
.theory td code{font-size:12.5px;}

/* Practice panel */
.practice{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  background:var(--panel);
}
.practice-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  background:var(--panel2);
  flex-wrap:wrap;
}
.practice-head .p-title{
  font-size:13px;color:var(--muted);font-weight:600;
  display:flex;align-items:center;gap:7px;
}
.practice-head .p-title b{color:var(--text);font-weight:600;}
.spacer{flex:1;}
.btn{
  border:1px solid var(--border);
  background:#21262d;
  color:var(--text);
  padding:6px 13px;
  border-radius:7px;
  font-size:12.8px;
  cursor:pointer;
  font-weight:600;
  transition:.14s;
  white-space:nowrap;
}
.btn:hover{background:#2b323b;border-color:#4a5560;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.primary{
  background:var(--green);border-color:var(--green);color:#03170a;
}
.btn.primary:hover{background:#4ac95c;}
.btn.gold{
  background:var(--gold);border-color:var(--gold);color:#241d0c;
}
.btn.gold:hover{background:#ffc63d;}
.btn.ghost{background:transparent;}
.btn.small{padding:4px 9px;font-size:12px;}

.editor-wrap{
  flex:1 1 auto;
  min-height:150px;
  position:relative;
  overflow:hidden;
  background:#282a36;
}
.editor-wrap textarea{
  width:100%;height:100%;
  background:#282a36;color:#f8f8f2;border:none;outline:none;
  font-family:"SFMono-Regular",Consolas,Menlo,monospace;
  font-size:13.5px;padding:12px;resize:none;
  line-height:1.55;
}
.CodeMirror{
  height:100% !important;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace !important;
  font-size:13.5px !important;
  line-height:1.55 !important;
  background:#282a36 !important;
}
.CodeMirror-gutters{background:#21222c !important;border-right:1px solid #191a21 !important;}
.CodeMirror-linenumber{color:#6272a4 !important;}

/* Console */
.console{
  height:210px;
  min-height:210px;
  border-top:1px solid var(--border);
  background:#0b0f14;
  display:flex;
  flex-direction:column;
}
.console-head{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;
  border-bottom:1px solid #1c2229;
  font-size:11.5px;
  letter-spacing:.9px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}
.dot{width:9px;height:9px;border-radius:50%;}
.dot.r{background:#ff5f57;}
.dot.y{background:#febc2e;}
.dot.g{background:#28c840;}
.console-body{
  flex:1;
  overflow-y:auto;
  padding:11px 14px;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:12.8px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
  color:#c9d1d9;
}
.console-body::-webkit-scrollbar{width:9px;}
.console-body::-webkit-scrollbar-thumb{background:#2b323b;border-radius:5px;}
.line-out{color:#c9d1d9;}
.line-err{color:#ff8a80;}
.line-sys{color:var(--muted);font-style:italic;}
.line-ok{color:var(--green);}
.line-bad{color:var(--red);}
.check-line{display:flex;gap:8px;align-items:flex-start;padding:2px 0;}
.check-line .ic{font-weight:900;}
.check-line.pass .ic{color:var(--green);}
.check-line.fail .ic{color:var(--red);}
.check-line.pass .tx{color:#a8dcb4;}
.check-line.fail .tx{color:#ffb3ae;}

/* footer nav */
.foot-nav{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;
  border-top:1px solid var(--border);
  background:var(--panel2);
}
.foot-nav .msg{font-size:12.5px;color:var(--muted);}

/* mobile */
@media(max-width:1000px){
  .main{flex-direction:column;overflow-y:auto;}
  .theory{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:none;overflow:visible;padding:22px 20px 40px;}
  .practice{min-height:640px;}
  .sidebar{
    position:fixed;left:0;top:56px;bottom:0;z-index:40;
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  .sidebar.open{transform:translateX(0);}
  .header-progress{max-width:none;}
  .pbar-text{display:none;}
}
.menu-btn{display:none;}
@media(max-width:1000px){.menu-btn{display:flex;}}

/* overlay */
.overlay{
  position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.5);
  z-index:35;display:none;
}
.overlay.show{display:block;}

/* loading splash */
#loader{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s;
}
#loader.hide{opacity:0;pointer-events:none;}
#loader .big{
  font-size:44px;font-weight:900;letter-spacing:-1.5px;
}
#loader .big span{color:var(--gold);}
#loader .sub{color:var(--muted);font-size:14px;}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid #232a33;border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-mini{
  width:220px;height:5px;background:#1b212a;border-radius:10px;overflow:hidden;
}
.progress-mini div{height:100%;width:0%;background:var(--gold);transition:width .3s;}
</style>
</head>

<script>
/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function dedent(str){
  const lines = str.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
  const indents = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
  const min = indents.length ? Math.min(...indents) : 0;
  return lines.map(l => l.slice(min)).join('\n');
}

/* ============================================================
   УЧЕБНАЯ ПРОГРАММА
   ============================================================ */
const CURRICULUM = [

/* ======================= МОДУЛЬ 1 ======================= */
{
module: "Модуль 1. Первые шаги",
lessons: [

{
id: "m1l1",
title: "print() и комментарии",
theory: dedent(`
<h2>Вывод на экран: print()</h2>
<p><code>print()</code> — самая первая функция, которую изучает каждый программист. Она выводит текст на экран.</p>
<pre><code>print("Привет, мир!")</code></pre>
<p>Текст (в программировании он называется <strong>строкой</strong>) заключается в кавычки — одинарные или двойные, разницы нет:</p>
<pre><code>print('Python — это круто')
print("Кавычки могут быть и такими")</code></pre>
<p>Можно передать сразу несколько значений — они разделятся пробелом:</p>
<pre><code>print("Мне", 25, "лет")
# Мне 25 лет</code></pre>

<h3>Комментарии</h3>
<p>Комментарии начинаются с символа <code>#</code> и не выполняются интерпретатором. Они нужны, чтобы объяснять код — другим людям и самому себе в будущем.</p>
<pre><code># Это комментарий, он не выполнится
print("А это выполнится")   # комментарий в конце строки</code></pre>

<div class="note">💡 <strong>Совет:</strong> пишите комментарии там, где логика неочевидна. Но не комментируйте каждую строку — код должен говорить сам за себя.</div>

<h3>Задание</h3>
<p>Выведите на экран фразу <code>Привет, мир!</code></p>
`),
starter: dedent(`
# Выведите на экран фразу: Привет, мир!
# Используйте функцию print()
`),
solution: dedent(`
print("Привет, мир!")
`),
tests: dedent(`
check("Программа вывела 'Привет, мир!'", _buf.getvalue().strip() == "Привет, мир!")
`)
},

{
id: "m1l2",
title: "Переменные",
theory: dedent(`
<h2>Что такое переменная</h2>
<p>Переменная — это именованная «коробка», в которой хранится значение. Создать её очень просто:</p>
<pre><code>name = "Алекс"
age = 25</code></pre>
<p>Знак <code>=</code> — это <strong>присваивание</strong>, а не сравнение. Читается так: «переменной <code>name</code> присвоить значение "Алекс"».</p>
<p>Значение можно менять в любой момент:</p>
<pre><code>x = 10
x = x + 5     # теперь x равно 15</code></pre>

<h3>Правила имён</h3>
<ul>
  <li>Можно использовать буквы, цифры и знак подчёркивания <code>_</code>.</li>
  <li>Имя не может начинаться с цифры.</li>
  <li>Регистр важен: <code>age</code> и <code>Age</code> — разные переменные.</li>
  <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т. д.).</li>
</ul>
<p>По соглашению в Python имена пишут в «змеином регистре»: <code>user_name</code>, <code>total_price</code>.</p>

<h3>Множественное присваивание</h3>
<pre><code>a, b = 1, 2
x = y = z = 0</code></pre>

<h3>Задание</h3>
<p>Создайте переменную <code>language</code> со значением <code>"Python"</code> и переменную <code>version</code> со значением <code>3</code>. Затем выведите обе переменные через <code>print()</code>.</p>
`),
starter: dedent(`
# Создайте переменные language и version
# и выведите их на экран


`),
solution: dedent(`
language = "Python"
version = 3
print(language, version)
`),
tests: dedent(`
check("language == 'Python'", globals().get("language") == "Python")
check("version == 3", globals().get("version") == 3)
check("Обе переменные выведены на экран", "Python" in _buf.getvalue() and "3" in _buf.getvalue())
`)
},

{
id: "m1l3",
title: "Типы данных",
theory: dedent(`
<h2>Основные типы данных</h2>
<p>В Python каждое значение имеет свой <strong>тип</strong>. Вот четыре самых важных:</p>
<table>
  <tr><th>Тип</th><th>Название</th><th>Пример</th></tr>
  <tr><td><code>int</code></td><td>целое число</td><td><code>42</code>, <code>-7</code>, <code>0</code></td></tr>
  <tr><td><code>float</code></td><td>дробное число</td><td><code>3.14</code>, <code>-0.5</code></td></tr>
  <tr><td><code>str</code></td><td>строка</td><td><code>"привет"</code></td></tr>
  <tr><td><code>bool</code></td><td>логический</td><td><code>True</code> / <code>False</code></td></tr>
</table>

<h3>Как узнать тип</h3>
<p>Функция <code>type()</code> возвращает тип значения:</p>
<pre><code>print(type(42))       # &lt;class 'int'&gt;
print(type(3.14))     # &lt;class 'float'&gt;
print(type("текст"))  # &lt;class 'str'&gt;
print(type(True))     # &lt;class 'bool'&gt;</code></pre>

<div class="note">💡 Обратите внимание: <code>True</code> и <code>False</code> пишутся с большой буквы. Это не строки — кавычки не нужны.</div>

<h3>Особый тип None</h3>
<p><code>None</code> означает «ничего», «отсутствие значения». Он часто используется как значение по умолчанию.</p>

<p>Переменные, созданные внутри функции, существуют только внутри неё — это <strong>локальная</strong> область видимости.</p>

    print(x)

<h3>Глобальные переменные</h3>
<p>Переменные, созданные на верхнем уровне модуля, видны внутри функций:</p>
<pre><code>counter = 0

<code>counter += 1</code> внутри функции создаст новую локальную переменную и вызовет <code>UnboundLocalError</code>.</div>

<h3>Ключевое слово global</h3>
<pre><code>counter = 0

def increment():
    global counter
    counter += 1

increment()
increment()
print(counter)   # 2</code></pre>

<div class="note">💡 <strong>Хорошая практика:</strong> избегайте <code>global</code>. Если функция должна что-то изменить — пусть она вернёт новое значение через <code>return</code>, а вызывающий код его присвоит.</div>
