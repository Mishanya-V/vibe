<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный интерактивный курс Python</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ ДИЗАЙН-СИСТЕМА ============ */
:root{
  --bg0:#0a0f1a; --bg1:#0f1726; --bg2:#142032; --bg3:#1a2a44;
  --line:rgba(148,180,255,.13); --line2:rgba(148,180,255,.22);
  --text:#dce6f7; --dim:#8ea2c0; --faint:#5c6f8f;
  --yellow:#ffd43b; --yellow-deep:#e8b400;
  --blue:#4b9be8; --green:#3ddc84; --red:#ff6b6b;
  --violet:#b48cff; --cyan:#4dd0e1; --orange:#ff8f5a; --pink:#ff6b81;
  --fd:'Unbounded',sans-serif; --fb:'IBM Plex Sans',system-ui,sans-serif; --fm:'JetBrains Mono',monospace;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--text);font:400 16px/1.65 var(--fb);min-height:100vh;overflow-x:hidden}
::selection{background:rgba(255,212,59,.28)}
/* фоновые слои: сетка + два дрейфующих свечения */
.bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 85%);
          mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 85%);}
.bg-layer::before,.bg-layer::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg-layer::before{width:640px;height:640px;left:-180px;top:-220px;background:radial-gradient(circle,rgba(75,155,232,.32),transparent 65%);animation:drift 22s ease-in-out infinite alternate}
.bg-layer::after{width:720px;height:720px;right:-240px;bottom:-300px;background:radial-gradient(circle,rgba(255,212,59,.16),transparent 65%);animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,50px) scale(1.12)}}

a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fd);line-height:1.2;letter-spacing:-.01em}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;
  padding:10px 18px;font:600 14px var(--fb);color:var(--text);background:var(--bg3);
  transition:transform .16s ease,box-shadow .16s ease,background .16s,border-color .16s,color .16s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--yellow);color:#221a00;box-shadow:0 4px 0 var(--yellow-deep)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--yellow-deep),0 8px 28px rgba(255,212,59,.25)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 2px 0 var(--yellow-deep)}
.btn.ghost{background:transparent;border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow);transform:translateY(-1px)}
.btn.blue{background:var(--bg3);border-color:rgba(75,155,232,.4)}
.btn.blue:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 26px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============ ШАПКА ============ */
header#topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  padding:10px 22px;background:rgba(13,20,34,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 3px 8px rgba(255,212,59,.25));transition:transform .3s}
.logo:hover svg{transform:rotate(-8deg) scale(1.06)}
.logo-word{font:700 19px var(--fd);color:#fff}
.logo-word b{color:var(--yellow);font-weight:900}
.mainnav{display:flex;gap:4px;margin-left:8px}
.mainnav a{padding:8px 14px;border-radius:8px;color:var(--dim);font-weight:600;font-size:14px;position:relative;transition:color .15s,background .15s}
.mainnav a:hover{color:#fff;background:var(--bg3)}
.mainnav a.active{color:var(--yellow)}
.mainnav a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;background:var(--yellow);border-radius:2px}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px}
.xp-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,212,59,.35);border-radius:99px;font:600 13px var(--fb);color:var(--yellow);background:rgba(255,212,59,.07)}
.xp-pill.pop{animation:xppop .5s ease}
@keyframes xppop{40%{transform:scale(1.18)}}
.ring-wrap{position:relative;width:38px;height:38px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:4}
.ring-fg{fill:none;stroke:var(--yellow);stroke-width:4;stroke-linecap:round;stroke-dasharray:100.53;transition:stroke-dashoffset .7s cubic-bezier(.5,1.4,.5,1)}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font:700 9px var(--fm);color:var(--dim)}
#btnSb{display:none;background:var(--bg3);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:7px 10px;font-size:15px}
body.view-lesson #btnSb{display:inline-flex}
@media(min-width:1201px){body.view-lesson #btnSb{display:none}}

/* ============ ОБЩЕЕ ============ */
#app{min-height:calc(100vh - 57px)}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r)}
.overline{font:500 12px var(--fm);color:var(--blue);letter-spacing:.14em;text-transform:uppercase}
.section-title{display:flex;align-items:baseline;gap:14px;margin:56px 0 22px}
.section-title .overline{white-space:nowrap}
.section-title h2{font-size:clamp(22px,3vw,32px)}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}

/* ============ ГЛАВНАЯ ============ */
.home{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
.home-top{display:grid;grid-template-columns:1.12fr .88fr;gap:34px;align-items:center}
.terminal{background:#070b13;border:1px solid var(--line2);border-radius:12px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.02) inset;transform:rotate(-.6deg);transition:transform .35s}
.terminal:hover{transform:rotate(0)}
.term-head{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#0d1420;border-bottom:1px solid var(--line)}
.term-head i{width:11px;height:11px;border-radius:50%}
.term-head i:nth-child(1){background:#ff5f57}.term-head i:nth-child(2){background:#febc2e}.term-head i:nth-child(3){background:#28c840}
.term-head span{margin-left:8px;font:500 12px var(--fm);color:var(--faint)}
.term-body{padding:18px;height:330px;overflow:hidden;font:400 13.5px/1.75 var(--fm)}
.tl-in{color:var(--faint)}.tl-in b{color:var(--green);font-weight:500}
.tl-out{color:var(--green);opacity:.9}
.tl-out::before{content:"↳ ";color:var(--faint)}
.tl-com{color:var(--faint);font-style:italic}
.cur{display:inline-block;width:8px;height:16px;background:var(--yellow);vertical-align:-3px;animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.home-side h1{font-size:clamp(30px,4.2vw,50px);font-weight:900;margin:14px 0 14px}
.home-side h1 em{font-style:normal;color:var(--yellow);position:relative}
.home-side h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:8px;background:rgba(255,212,59,.18);z-index:-1}
.lede{color:var(--dim);font-size:17px;max-width:46ch}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0}
.stat{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:var(--line2)}
.stat b{display:block;font:700 22px var(--fd);color:var(--yellow)}
.stat:nth-child(2) b{color:var(--blue)}.stat:nth-child(3) b{color:var(--green)}.stat:nth-child(4) b{color:var(--cyan)}
.stat span{font-size:12px;color:var(--faint)}
.home-ctas{display:flex;gap:12px;flex-wrap:wrap}

/* карта курса */
.modules{list-style:none;display:flex;flex-direction:column;gap:14px}
.module-card{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center;
  background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.module-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--yellow));opacity:.85}
.module-card:hover{transform:translateX(6px);border-color:var(--acc,var(--yellow));box-shadow:0 10px 34px rgba(0,0,0,.35)}
.m-num{font:900 44px var(--fd);color:transparent;-webkit-text-stroke:1.5px var(--acc,var(--yellow));opacity:.9}
.m-body h3{font-size:18px;margin-bottom:4px}
.m-body p{color:var(--dim);font-size:14px;margin-bottom:12px;max-width:64ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;
  font:600 10px var(--fm);color:var(--faint);cursor:pointer;transition:transform .15s,background .15s,color .15s;position:relative}
.chip:hover{transform:translateY(-3px) scale(1.12);color:#fff;border-color:var(--acc)}
.chip.done{background:rgba(61,220,132,.16);border-color:rgba(61,220,132,.5);color:var(--green)}
.chip.current{background:rgba(255,212,59,.16);border-color:var(--yellow);color:var(--yellow);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,212,59,.12)}}
.m-prog{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;max-width:340px}
.m-prog i{display:block;height:100%;background:var(--acc,var(--yellow));border-radius:99px;transition:width .8s cubic-bezier(.3,1,.3,1)}
.m-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.m-count{font:600 12px var(--fm);color:var(--faint)}

/* как это работает — bento */
.how{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.tile{border-radius:var(--r);padding:22px;background:var(--bg1);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-4px);border-color:var(--line2)}
.tile .ico{font-size:26px;display:inline-block;margin-bottom:10px;transition:transform .25s}
.tile:hover .ico{transform:scale(1.2) rotate(-6deg)}
.tile h3{font-size:16px;margin-bottom:6px}
.tile p{color:var(--dim);font-size:14px}
.t-a{grid-column:span 7}.t-b{grid-column:span 5}
.t-c{grid-column:span 4}.t-d{grid-column:span 4}.t-e{grid-column:span 4}
.mini-ed{margin-top:14px;background:#070b13;border-radius:9px;padding:12px 14px;font:400 12px/1.9 var(--fm);border:1px solid var(--line)}
.mini-ed i{font-style:normal}
.mini-ed .k{color:#ffd43b}.mini-ed .s{color:#7ee787}.mini-ed .n{color:#79c0ff}.mini-ed .f{color:#82aaff}
.mini-tests{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.mini-tests span{display:flex;gap:8px;align-items:center;font:500 12.5px var(--fm);color:var(--dim);
  background:var(--bg2);padding:7px 11px;border-radius:8px;border:1px solid var(--line)}
.mini-tests b{color:var(--green);font-weight:700}

/* ============ УРОК ============ */
.lesson{display:grid;grid-template-columns:264px minmax(320px,var(--info,44%)) 7px minmax(0,1fr);height:calc(100vh - 57px)}
.sidebar{background:var(--bg1);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px 30px}
.sb-prog{padding:12px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-prog .lbl{display:flex;justify-content:space-between;font:600 12px var(--fm);color:var(--dim);margin-bottom:8px}
.sb-bar{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.sb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .6s}
.sb-mod{margin-bottom:6px}
.sb-mod-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--dim);
  font:600 13px var(--fb);padding:9px 10px;border-radius:8px;text-align:left;transition:background .15s,color .15s}
.sb-mod-h:hover{background:var(--bg2);color:#fff}
.sb-mod-h .acc{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sb-mod-h .cnt{margin-left:auto;font:500 11px var(--fm);color:var(--faint)}
.sb-mod-h .arr{transition:transform .2s;font-size:10px}
.sb-mod.closed .arr{transform:rotate(-90deg)}
.sb-mod.closed .sb-list{display:none}
.sb-list{list-style:none;padding:4px 0 6px 12px}
.sb-lesson{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;
  color:var(--dim);font-size:13.5px;border-left:2px solid transparent;transition:background .13s,color .13s}
.sb-lesson:hover{background:var(--bg2);color:#fff}
.sb-lesson.active{background:var(--bg3);color:var(--yellow);border-left-color:var(--yellow)}
.sb-lesson .st{width:15px;text-align:center;font-size:11px;flex-shrink:0}
.sb-lesson.done .st{color:var(--green)}

.pane{overflow-y:auto;min-width:0}
.pane-info{padding:26px 30px 60px}
.crumb{display:flex;align-items:center;gap:10px;font:600 12px var(--fm);color:var(--dim);margin-bottom:14px;flex-wrap:wrap}
.crumb .acc-dot{width:9px;height:9px;border-radius:3px}
.crumb .time{margin-left:auto;color:var(--faint);font-weight:400}
.lesson-title{font-size:clamp(22px,2.4vw,30px);font-weight:900;margin-bottom:18px}
.theory p{margin-bottom:13px;color:#c4d2e8}
.theory b{color:#fff}
.theory ul{margin:0 0 13px 22px;color:#c4d2e8}
.theory li{margin-bottom:5px}
.ic{font:500 .86em var(--fm);background:var(--bg3);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--cyan);white-space:nowrap}
pre.code{background:#0a101c;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:9px;
  padding:13px 16px;margin:0 0 15px;font:400 13.5px/1.7 var(--fm);overflow-x:auto;color:#dce6f7}
.taskbox{margin-top:26px;border:1px solid rgba(255,212,59,.35);border-radius:12px;background:rgba(255,212,59,.05);overflow:hidden}
.taskbox h4{font:700 13px var(--fm);letter-spacing:.1em;padding:10px 16px;background:rgba(255,212,59,.12);color:var(--yellow)}
.taskbox .tb-body{padding:14px 16px;font-size:15px}
.taskbox .tb-body p{margin-bottom:8px}
.hintbox{margin-top:12px;border:1px solid rgba(75,155,232,.4);border-radius:10px;background:rgba(75,155,232,.07);padding:13px 16px;font-size:14px;color:#bcd6f5;animation:slideIn .3s ease}
.hintbox b{color:var(--blue)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}}
.done-banner{margin-top:22px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;
  background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.4);color:var(--green);font-weight:600;font-size:14px}
.lesson-nav{display:flex;gap:10px;margin-top:30px;align-items:center}
.lesson-nav .btn.next.pulse{animation:npulse 1.6s infinite}
@keyframes npulse{50%{box-shadow:0 4px 0 var(--yellow-deep),0 0 0 9px rgba(255,212,59,.1)}}

.split{cursor:col-resize;background:transparent;position:relative;z-index:5}
.split::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line)}
.split:hover::before,.split.on::before{width:3px;left:2px;background:var(--yellow)}

.pane-code{padding:18px 20px 30px;display:flex;flex-direction:column;gap:14px;background:rgba(10,15,26,.5)}
.editor-card{background:var(--bg1);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:380px}
.ed-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-file{display:flex;align-items:center;gap:8px;font:500 12.5px var(--fm);color:var(--dim);margin-right:auto}
.ed-file i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.ed-file i.busy{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 1s infinite}
.ed-file i.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.editor-shell{display:flex;flex:1;min-height:260px;background:#0a101c;position:relative}
.gutter{width:46px;flex-shrink:0;background:#0a101c;border-right:1px solid var(--line);overflow:hidden;position:relative}
.gutter-inner{position:absolute;top:0;left:0;right:0;padding:14px 10px 14px 0;text-align:right;font:400 14px/1.6 var(--fm);color:#33415c;white-space:pre;user-select:none}
.code-area{position:relative;flex:1;overflow:hidden}
.code-area pre.hl,.code-area textarea.ta{position:absolute;inset:0;padding:14px 16px;margin:0;border:none;
  font:400 14px/1.6 var(--fm);tab-size:4;white-space:pre;word-wrap:normal;background:transparent;color:#dce6f7}
.code-area pre.hl{overflow:auto;pointer-events:none;scrollbar-width:none}
.code-area pre.hl::-webkit-scrollbar{display:none}
.code-area textarea.ta{overflow:auto;resize:none;outline:none;color:transparent;caret-color:var(--yellow);z-index:2}
.code-area textarea.ta::selection{background:rgba(75,155,232,.3)}
.t-kw{color:var(--yellow)}.t-str{color:#7ee787}.t-com{color:#51617e;font-style:italic}.t-num{color:#79c0ff}
.t-bi{color:#82aaff}.t-const{color:#ff8f5a}
.console{background:#070b13;border-top:1px solid var(--line);max-height:200px;display:flex;flex-direction:column}
.console-head{display:flex;align-items:center;padding:7px 14px;font:700 10.5px var(--fm);letter-spacing:.16em;color:var(--faint)}
.console-head button{margin-left:auto;background:none;border:none;color:var(--faint);font-size:12px;transition:color .15s}
.console-head button:hover{color:var(--red)}
#console-out{padding:4px 14px 12px;font:400 13px/1.7 var(--fm);color:#c9d7ee;overflow-y:auto;white-space:pre-wrap;min-height:44px}
.c-err{color:var(--red)}
.c-ph{color:#33415c}

.tests-card{background:var(--bg1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tests-head{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--bg2);border-bottom:1px solid var(--line);font:700 13px var(--fb)}
.tests-badge{margin-left:auto;font:600 12px var(--fm);color:var(--dim);background:var(--bg3);padding:3px 10px;border-radius:99px;transition:background .3s,color .3s}
.tests-badge.ok{background:rgba(61,220,132,.18);color:var(--green)}
.tests-badge.bad{background:rgba(255,107,107,.15);color:var(--red)}
#test-list{list-style:none;padding:8px}
#test-list li{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--dim);transition:background .2s}
#test-list li .t-ico{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font-size:11px;font-weight:700;transition:all .25s}
#test-list li.pass{color:#c4ecd6;background:rgba(61,220,132,.06)}
#test-list li.pass .t-ico{background:var(--green);border-color:var(--green);color:#04160c;transform:scale(1.08)}
#test-list li.pass .t-ico::before{content:"✓"}
#test-list li.fail{color:#f3b8b8;background:rgba(255,107,107,.06)}
#test-list li.fail .t-ico{background:var(--red);border-color:var(--red);color:#fff}
#test-list li.fail .t-ico::before{content:"✕"}
#test-list li.fail{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#test-list li.run .t-ico{border-color:var(--yellow);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.mtabs{display:none}

/* ============ ПЕСОЧНИЦА ============ */
.play{max-width:1100px;margin:0 auto;padding:30px 24px 60px;display:flex;flex-direction:column;gap:16px;height:calc(100vh - 57px)}
.play h1{font-size:26px;font-weight:900}
.play h1 span{color:var(--yellow)}
.play .editor-card{min-height:0}

/* ============ МОДАЛКИ / ТОСТЫ ============ */
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg2);border:1px solid var(--line2);border-left:4px solid var(--yellow);border-radius:10px;
  padding:12px 18px;font-weight:600;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .3s ease;max-width:320px}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}.toast.info{border-left-color:var(--blue)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
.toast.out{opacity:0;transform:translateX(30px);transition:all .3s}
.modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(5,8,15,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.cert{background:#fdfaf1;color:#1d2433;border:3px solid var(--yellow);outline:2px solid #2f6cb3;outline-offset:6px;
  border-radius:6px;max-width:640px;width:100%;padding:46px 48px;text-align:center;position:relative;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:certin .45s cubic-bezier(.3,1.4,.4,1)}
@keyframes certin{from{opacity:0;transform:scale(.85) translateY(30px)}}
.cert .snake-wm{position:absolute;right:-14px;bottom:-20px;font-size:150px;opacity:.06;pointer-events:none}
.cert-logo{font:700 15px var(--fd);letter-spacing:.2em;color:#2f6cb3;margin-bottom:18px}
.cert h2{font:900 clamp(24px,4vw,34px) var(--fd);letter-spacing:.06em;margin-bottom:8px}
.cert-sub{color:#68738c;font-size:14px;margin:10px 0 4px}
.cert input{border:none;border-bottom:2px dashed #b8a63f;background:transparent;text-align:center;
  font:700 clamp(20px,3vw,28px) var(--fd);color:#17233b;width:90%;padding:6px;outline:none}
.cert input:focus{border-bottom-color:#2f6cb3}
.cert h3{font:700 18px var(--fd);color:#2f6cb3;margin:8px 0 22px}
.cert-meta{display:flex;justify-content:space-between;font:500 12px var(--fm);color:#8a93a8;border-top:1px solid #e4ddc6;padding-top:14px}
.cert-sign{margin-top:18px;font-size:12px;color:#8a93a8;font-style:italic}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:26px}
.confetto{position:fixed;top:-20px;z-index:300;pointer-events:none;border-radius:2px}

/* ============ АДАПТИВ ============ */
@media(max-width:1200px){
  .lesson{grid-template-columns:minmax(0,var(--info,47%)) 7px minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:57px;bottom:0;width:290px;z-index:90;transform:translateX(-105%);transition:transform .28s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .sb-backdrop{position:fixed;inset:57px 0 0;z-index:85;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
  .sb-backdrop.show{opacity:1;pointer-events:auto}
}
@media(max-width:980px){
  .home-top{grid-template-columns:1fr}
  .term-body{height:280px}
  .module-card{grid-template-columns:64px 1fr}
  .m-right{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;width:100%}
  .m-num{font-size:32px}
  .t-a,.t-b,.t-c,.t-d,.t-e{grid-column:span 12}
  .mainnav a span{display:none}
}
@media(max-width:860px){
  .lesson{display:block;height:auto;overflow:visible}
  .pane{overflow:visible;height:auto}
  .mtabs{display:flex;gap:8px;padding:12px 16px;background:var(--bg1);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:40}
  .mtabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);color:var(--dim);font:600 13px var(--fb)}
  .mtabs button.on{background:var(--yellow);color:#221a00;border-color:var(--yellow)}
  .lesson[data-view="info"] .pane-code,.lesson[data-view="info"] .split{display:none}
  .lesson[data-view="code"] .pane-info{display:none}
  .editor-card{min-height:440px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .pane-info{padding:20px 18px 50px}
  .pane-code{padding:14px}
}
@media print{
  body.cert-print > *:not(#modal-root){display:none!important}
  body.cert-print{background:#fff}
  .modal-overlay{position:static;background:#fff;padding:0;display:block}
  .cert{box-shadow:none;max-width:100%}
  .no-print{display:none!important}
}

<!-- Интерпретатор Python в браузере -->
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<script>
/* ================================================================
   PyCamp — интерактивный курс Python в одном файле
   ================================================================ */

/* ---------- утилиты ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const p=t=>'<p>'+t+'</p>';
const ex=c=>'<pre class="code">'+esc(c)+'</pre>';
const ic=c=>'<code class="ic">'+esc(c)+'</code>';
function deepEq(a,b){
  if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<1e-9;
  if(Array.isArray(a)&&Array.isArray(b))return a.length===b.length&&a.every((v,i)=>deepEq(v,b[i]));
  if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){
    const ka=Object.keys(a),kb=Object.keys(b);
    return ka.length===kb.length&&ka.every(k=>deepEq(a[k],b[k]));
  }
  return a===b;
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* ---------- состояние ---------- */
const LS='pycamp_v1';
let STATE={xp:0,done:{},drafts:{},name:''};
try{Object.assign(STATE,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const saveState=()=>{try{localStorage.setItem(LS,JSON.stringify(STATE))}catch(e){}};

/* ---------- помощники для автотестов ---------- */
const C={
  out:s=>c=>c.ok&&c.output.includes(s),
  outExact:s=>c=>c.ok&&c.output.trim()===s.trim(),
  outRe:re=>c=>c.ok&&re.test(c.output),
  code:re=>c=>re.test(c.code),
  varEq:(n,v)=>c=>c.ok&&deepEq(c.vars[n],v),
  varType:(n,t)=>c=>c.ok&&typeof c.vars[n]===t,
  fn:(n,args,val)=>async c=>{ if(!c.ok)return false; try{return deepEq(await c.call(n,args),val)}catch(e){return false} },
};

/* ---------- ЦЕЛОЧИСЛЕННЫЕ ДАННЫЕ КУРСА ---------- */
const COURSE=[
{ id:'m1',title:'Основы синтаксиса',acc:'#ffd43b',intro:'Первые шаги: вывод, переменные, числа, строки и ввод данных.',lessons:[
{id:'m1l1',title:'Привет, Python!',time:'7 мин',xp:50,
theory:p('Python — один из самых популярных языков программирования в мире: на нём пишут сайты, нейросети, игры и скрипты для автоматизации.')+
p('Программа на Python выполняется <b>интерпретатором</b> — строка за строкой, сверху вниз. Самая известная команда — '+ic('print()')+': она выводит текст на экран.')+
ex('print("Привет!")\nprint(2 + 2)')+
p('Текст в кавычках называется <b>строкой</b>. Кавычки могут быть двойными или одинарными — главное, чтобы они совпадали.'),
task:p('Выведи на экран две строки (каждую — отдельным вызовом '+ic('print()')+'):')+
p('1) '+ic('Привет, Python!')+'<br>2) '+ic('Я стану разработчиком')),
start:'# Твой первый код на Python 🐍\n# Напиши два вызова print() ниже\n',
hint:p('Каждая строка — свой '+ic('print()')+'. Текст обязательно в кавычках: '+ic('print("текст")')),
solution:'print("Привет, Python!")\nprint("Я стану разработчиком")',
tests:[
 {text:'Выводится строка «Привет, Python!»',check:C.out('Привет, Python!')},
 {text:'Выводится строка «Я стану разработчиком»',check:C.out('Я стану разработчиком')},
 {text:'Используется функция print()',check:C.code(/print\s*\(/)},
]},
{id:'m1l2',title:'Переменные',time:'9 мин',xp:50,
theory:p('<b>Переменная</b> — это имя, за которым хранится значение. Создаётся она просто: имя, знак '+ic('=')+', значение.')+
ex('name = "Аня"\nage = 25\nprint(name)  # Аня')+
p('Имена пишут латиницей без пробелов (используй '+ic('_')+'): '+ic('user_name')+', '+ic('score2')+'. Python различает регистр: '+ic('Name')+' и '+ic('name')+' — разные переменные.'),
task:p('Создай две переменные и выведи каждую функцией '+ic('print()')+':')+
p('• '+ic('name')+' — твоё имя (строка в кавычках);<br>• '+ic('age')+' — возраст (число без кавычек).')),
start:'# Создай переменные здесь\n',
hint:p('Строка — в кавычках: '+ic('name = "Саша")')+', число — без: '+ic('age = 20')+'.'),
solution:'name = "Саша"\nage = 20\nprint(name)\nprint(age)',
tests:[
 {text:'Переменная name содержит строку',check:C.code(/\bname\s*=\s*["']/)},
 {text:'Переменная age содержит число',check:C.varType('age','number')},
 {text:'Вызов print() встречается минимум дважды',check:c=>(c.code.match(/print\s*\(/g)||[]).length>=2},
]},
{id:'m1l3',title:'Числа и арифметика',time:'10 мин',xp:50,
theory:p('Python — отличный калькулятор. Обычные операторы: '+ic('+ - * /')+', а также:')+
p('• '+ic('//')+' — целочисленное деление (отбрасывает дробную часть);<br>• '+ic('%')+' — остаток от деления;<br>• '+ic('**')+' — возведение в степень.')+
ex('print(17 // 5)   # 3\nprint(17 % 5)    # 2\nprint(2 ** 10)   # 1024'),
task:p('Создай переменные '+ic('a = 17')+' и '+ic('b = 5')+'. Выведи по одному числу на строку в таком порядке: сумму, разность, произведение, целочисленное деление и остаток от деления.')+
p('Ожидаемый вывод: '+ic('22, 12, 85, 3, 2'))),
start:'a = 17\nb = 5\n',
hint:p('Пять отдельных '+ic('print()')+', например '+ic('print(a + b)')+'. Не забудь про '+ic('//')+' и '+ic('%')+'.'),
solution:'a = 17\nb = 5\nprint(a + b)\nprint(a - b)\nprint(a * b)\nprint(a // b)\nprint(a % b)',
tests:[
 {text:'Вывод равен 22, 12, 85, 3, 2 — по числу на строку',check:C.outExact('22\n12\n85\n3\n2')},
 {text:'Используется целочисленное деление //',check:C.code(/\/\//)},
 {text:'Используется остаток от деления %',check:C.code(/%/)},
]},
{id:'m1l4',title:'Строки',time:'9 мин',xp:50,
theory:p('Строки можно <b>склеивать</b> оператором '+ic('+')+' и <b>повторять</b> оператором '+ic('*')+'. Функция '+ic('len()')+' возвращает длину строки.')+
ex('print("Py" + "Camp")   # PyCamp\nprint("ха" * 3)        # хахаха\nprint(len("Python"))    # 6'),
task:p('Создай переменную '+ic('word = "Python"')+'. Выведи:')+
p('1) слово, повторённое три раза ('+ic('PythonPythonPython')+');<br>2) длину слова с помощью '+ic('len()')+'.')),
start:'word = "Python"\n',
hint:p('Повторение: '+ic('print(word * 3)')+'. Длина: '+ic('print(len(word))')+'.'),
solution:'word = "Python"\nprint(word * 3)\nprint(len(word))',
tests:[
 {text:'Выводится PythonPythonPython',check:C.out('PythonPythonPython')},
 {text:'Выводится длина — 6',check:C.outRe(/\b6\b/)},
 {text:'Используется функция len()',check:C.code(/len\s*\(/)},
]},
{id:'m1l5',title:'Преобразование типов',time:'8 мин',xp:50,
theory:p('Число и его строковая запись — разные вещи: '+ic('"5" + "5"')+' даст '+ic('"55"')+', а не 10. Чтобы превращать типы друг в друга, есть функции:')+
p('• '+ic('int()')+' — в целое число;<br>• '+ic('float()')+' — в дробное;<br>• '+ic('str()')+' — в строку.')+
ex('s = "42"\nn = int(s)\nprint(n + 1)   # 43'),
task:p('Дана строка '+ic('s = "199"')+'. ')+'<p>1) Преобразуй её в целое число, прибавь 1 и выведи результат (должно получиться '+ic('200')+').<br>2) Выведи ту же строку, преобразованную в '+ic('float()')+' (получится '+ic('199.0')+').'),
start:'s = "199"\n',
hint:p('Сначала '+ic('n = int(s)')+', затем '+ic('print(n + 1)')+' и '+ic('print(float(s))')+'.'),
solution:'s = "199"\nn = int(s)\nprint(n + 1)\nprint(float(s))',
tests:[
 {text:'Выводится 200',check:C.out('200')},
 {text:'Выводится 199.0',check:C.out('199.0')},
 {text:'Используется преобразование int()',check:C.code(/int\s*\(/)},
]},
{id:'m1l6',title:'Ввод данных: input()',time:'10 мин',xp:50,
theory:p('Функция '+ic('input()')+' останавливает программу и ждёт, пока пользователь что-нибудь введёт. Важно: '+ic('input()')+' <b>всегда возвращает строку</b> — даже если ввели число.')+
ex('name = input("Как тебя зовут? ")\nprint("Привет, " + name + "!")')+
p('В этом уроке мы подставим ответы за тебя: имя — '+ic('Аня')+', возраст — '+ic('12')+'.'),
task:p('Спроси у пользователя имя ('+ic('input()')+'), затем возраст ('+ic('input()')+'), и выведи строку вида:')+
p(ic('Привет, Аня! Тебе 12 лет.')+' — с теми значениями, которые ввёл пользователь.')),
start:'# Спроси имя и возраст через input()\n',
hint:p('Склей строку из частей: '+ic('print("Привет, " + name + "! Тебе " + age + " лет.")')),
solution:'name = input("Как тебя зовут? ")\nage = input("Сколько тебе лет? ")\nprint("Привет, " + name + "! Тебе " + age + " лет.")',
input:['Аня','12'],
tests:[
 {text:'Программа использует input()',check:C.code(/input\s*\(/)},
 {text:'Приветствие содержит введённое имя («Привет, Аня!»)',check:C.out('Привет, Аня!')},
 {text:'В ответе упоминается возраст (12 … лет)',check:c=>c.ok&&c.output.includes('12')&&/лет/.test(c.output)},
]},
]},
{ id:'m2',title:'Условия и логика',acc:'#4b9be8',intro:'Учим программу принимать решения: сравнения, if/else, elif и логические операторы.',lessons:[
{id:'m2l1',title:'Сравнения и булевы значения',time:'8 мин',xp:50,
theory:p('Результат сравнения — особое значение типа <b>bool</b>: '+ic('True')+' (истина) или '+ic('False')+' (ложь). Пишутся с большой буквы.')+
p('Операторы сравнения: '+ic('==')+' равно, '+ic('!=')+' не равно, '+ic('> <')+', '+ic('>= <=')+'. Обрати внимание: '+ic('=')+' — присваивание, а '+ic('==')+' — сравнение.')+
ex('print(7 > 3)    # True\nprint(7 == 8)   # False'),
task:p('Создай переменную '+ic('x = 10')+' и выведи на трёх строках результаты сравнений:')+
p('1) '+ic('x > 5')+'<br>2) '+ic('x == 10')+'<br>3) '+ic('x != 10')+'<br>Должно получиться: '+ic('True, True, False')+'.')),
start:'x = 10\n',
hint:p('Три вызова '+ic('print()')+', внутри каждого — сравнение, например '+ic('print(x > 5)')+'.'),
solution:'x = 10\nprint(x > 5)\nprint(x == 10)\nprint(x != 10)',
tests:[
 {text:'Вывод: True, True, False — по строке на значение',check:C.outExact('True\nTrue\nFalse')},
 {text:'Используется сравнение >',check:C.code(/>/)},
 {text:'Используется сравнение ==',check:C.code(/==/)},
]},
{id:'m2l2',title:'Условный оператор if / else',time:'11 мин',xp:50,
theory:p('Оператор '+ic('if')+' выполняет блок кода, только если условие истинно. Блок выделяется <b>отступом в 4 пробела</b> — в Python отступы обязательны!')+
ex('temp = 30\nif temp > 25:\n    print("Жарко!")\nelse:\n    print("Нормально")')+
p('Ветка '+ic('else')+' срабатывает, когда условие ложно.'),
task:p('Создай переменную '+ic('number = 42')+'. Если число чётное (делится на 2 без остатка), выведи '+ic('чётное')+', иначе — '+ic('нечётное')+'.')),
start:'number = 42\n',
hint:p('Чётность проверяется так: '+ic('if number % 2 == 0:')+'. Не забудь двоеточие и отступ.'),
solution:'number = 42\nif number % 2 == 0:\n    print("чётное")\nelse:\n    print("нечётное")',
tests:[
 {text:'Для 42 выводится «чётное»',check:C.out('чётное')},

/* ---------- интерпретатор Python (Skulpt) ---------- */
async function runCode(code,input){
  if(typeof Sk==='undefined')return{ok:false,output:'',error:'Интерпретатор не загрузился. Проверь подключение к интернету и обнови страницу.'};
  let out='';const queue=(input||[]).slice();
  Sk.configure({
    output:t=>{out+=t},
    read:x=>{ if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw{toString:()=>"File not found: "+x}; return Sk.builtinFiles.files[x]; },
    __future__:Sk.python3,
    inputfun:prompt=>{ out+=prompt; const v=queue.length?queue.shift():''; out+=v+'\n'; return Promise.resolve(v); },
    inputfunTakesPrompt:true,
    execLimit:6000,
  });
  try{
    await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true));
    const vars={};
    for(const k in Sk.globals){ if(k.startsWith('__'))continue; try{vars[k]=Sk.ffi.remapToJs(Sk.globals[k])}catch(e){vars[k]=undefined} }
    return {ok:true,output:out,vars,code,
      hasFn:n=>!!Sk.globals[n],
      call:async(name,args)=>{
        const f=Sk.globals[name]; if(!f)throw new Error('noFn:'+name);
        const pa=(args||[]).map(a=>Sk.ffi.remapToPy(a));
        const r=await Sk.misceval.asyncToPromise(()=>Sk.misceval.callsimArray(f,pa,[]));
        return (r===null||r===undefined)?null:Sk.ffi.remapToJs(r);
      }};
  }catch(err){
    let msg=err&&err.toString?err.toString():String(err);
    if(/time limit/i.test(msg))msg='⏱ Превышено время выполнения — проверь, нет ли бесконечного цикла.';
    return {ok:false,output:out,error:msg,code,vars:{},hasFn:()=>false,call:async()=>{throw new Error('err')}};
  }
}

/* ---------- подсветка синтаксиса ---------- */
const PY_RE=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbufRBUF]{0,2}"(?:\\[\s\S]|[^"\\\n])*"|[rbufRBUF]{0,2}'(?:\\[\s\S]|[^'\\\n])*')|\b(def|class|return|if|elif|else|while|for|in|not|and|or|is|break|continue|import|from|as|try|except|finally|raise|pass|lambda|global|nonlocal|del|with|yield|assert)\b|\b(True|False|None|self)\b|\b(print|input|len|range|int|str|float|bool|list|dict|set|tuple|sum|min|max|abs|round|sorted|enumerate|zip|map|filter|type|ValueError|ZeroDivisionError|TypeError|IndexError|KeyError|Exception)\b|\b(\d+(?:\.\d+)?)\b/g;
function highlight(src){
  let out='',last=0,m;PY_RE.lastIndex=0;
  while((m=PY_RE.exec(src))){
    out+=esc(src.slice(last,m.index));
    let cls='t-kw';
    if(m[1])cls='t-com';else if(m[2]||m[3])cls='t-str';else if(m[5])cls='t-const';else if(m[6])cls='t-bi';else if(m[7])cls='t-num';
    out+='<span class="'+cls+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}

/* ---------- редактор кода ---------- */
let RUN=null,CHECK=null;
function createEditor(mount,initial,onInput){
  mount.innerHTML='<div class="editor-shell"><div class="gutter"><div class="gutter-inner">1</div></div><div class="code-area"><pre class="hl" aria-hidden="true"></pre><textarea class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Редактор кода Python"></textarea></div></div>';
  const ta=$('.ta',mount),hl=$('.hl',mount),gi=$('.gutter-inner',mount);
  function refresh(){
    const v=ta.value;
    hl.innerHTML=highlight(v)+'\n';
    gi.textContent=Array.from({length:v.split('\n').length},(_,i)=>i+1).join('\n');
    if(onInput)onInput(v);
  }
  function sync(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gi.style.transform='translateY('+(-ta.scrollTop)+'px)'}
  function ins(text){ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end');refresh();sync()}
  ta.addEventListener('input',refresh);
  ta.addEventListener('scroll',sync);
  ta.addEventListener('keydown',ev=>{
    if(ev.key==='Tab'){ev.preventDefault();
      if(!ev.shiftKey){ins('    ')}
      else{const v=ta.value,s=v.lastIndexOf('\n',ta.selectionStart-1)+1;
        const cut=Math.min(4,(v.slice(s).match(/^ */)||[''])[0].length);
        if(cut){ta.setRangeText('',s,s+cut);ta.selectionStart=ta.selectionEnd=Math.max(s,ta.selectionStart-cut);refresh();sync()}}
    }else if(ev.key==='Enter'){
      ev.preventDefault();
      const before=ta.value.slice(0,ta.selectionStart);
      const line=before.slice(before.lastIndexOf('\n')+1);
      const ind=(line.match(/^\s*/)||[''])[0];
      const extra=/:\s*(#.*)?$/.test(line)?'    ':'';
      ins('\n'+ind+extra);
    }else if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){
      ev.preventDefault();
      if(ev.shiftKey){if(CHECK)CHECK()}else{if(RUN)RUN()}
    }
  });
  ta.value=initial;refresh();
  return{get:()=>ta.value,set:v=>{ta.value=v;refresh();sync()},focus:()=>ta.focus()};
}

/* ---------- консоль ---------- */
function renderConsole(el,ctx,busy){
  if(busy){el.innerHTML='<span class="c-ph">▸ выполняется…</span>';return}
  if(!ctx){el.innerHTML='<span class="c-ph">— вывод появится здесь · нажми «Запустить» или Ctrl+Enter —</span>';return}
  let html=ctx.output?esc(ctx.output):'<span class="c-ph">— программа ничего не вывела —</span>';
  if(ctx.error)html='<span class="c-err">⚠ '+esc(ctx.error)+'</span>\n'+html;
  el.innerHTML=html+'<span class="cur"></span>';
}

        <button class="btn ghost small" id="btnPrev" ${prev?'':'disabled'}>← ${prev?esc(prev.title):'старт'}</button>
        <button class="btn primary small next ${done&&next?'pulse':''}" id="btnNext" ${next?'':'disabled'}>${next?esc(next.title):'финал'} →</button>
      </div>
    </section>
    <div class="split" id="splitHandle" title="Потяни, чтобы изменить ширину"></div>
    <section class="pane pane-code">
      <div class="editor-card">
        <div class="ed-head">
          <span class="ed-file"><i id="statusDot"></i> main.py <span style="opacity:.5">· python 3</span></span>
          <button class="btn ghost small" id="btnReset" title="Вернуть стартовый код">↺ Сброс</button>
          <button class="btn ghost small" id="btnHint" title="Показать подсказку">💡 Подсказка</button>
          <button class="btn ghost small" id="btnSolution" title="${done?'Показать решение':'Откроется после прохождения'}">🔓 Решение</button>
          <button class="btn blue small" id="btnRun" title="Ctrl+Enter">▶ Запустить</button>
          <button class="btn primary small" id="btnCheck" title="Ctrl+Shift+Enter">✔ Проверить</button>
        </div>
        <div id="editorMount" style="display:flex;flex:1;min-height:240px"></div>
        <div class="console">
          <div class="console-head">ВЫВОД <button id="btnClear">очистить</button></div>
          <pre id="console-out"></pre>
        </div>
      </div>
      <div class="tests-card">
        <div class="tests-head">🧪 Тесты урока <span class="tests-badge" id="testsBadge">0/${l.tests.length}</span></div>
        <ul id="test-list">${l.tests.map((t,i)=>'<li class="pending"><span class="t-ico"></span><span class="t-text">'+esc(t.text)+'</span></li>').join('')}</ul>
      </div>
    </section>
  </div>`;

  currentEditor=createEditor($('#editorMount'),draft!=null?draft:l.start,debounce(v=>{STATE.drafts[l.id]=v;saveState()},500));
  renderConsole($('#console-out'),null);

  const setDot=st=>{const d=$('#statusDot');d.className=st||''};
  async function doRun(){
    setDot('busy');renderConsole($('#console-out'),null,true);
    const ctx=await runCode(currentEditor.get(),l.input);
    renderConsole($('#console-out'),ctx);setDot(ctx.ok?'':'err');
  }
  async function doCheck(){
    setDot('busy');renderConsole($('#console-out'),null,true);
    const lis=$$('#test-list li');lis.forEach(li=>li.className='pending');
    const badge=$('#testsBadge');badge.className='tests-badge';badge.textContent='…/'+l.tests.length;
    const ctx=await runCode(currentEditor.get(),l.input);
    renderConsole($('#console-out'),ctx);setDot(ctx.ok?'':'err');
    let passed=0;
    if(ctx.ok){
      for(let i=0;i<l.tests.length;i++){
        lis[i].className='run';
        await sleep(200);
        let ok=false;try{ok=await l.tests[i].check(ctx)}catch(e){ok=false}
        lis[i].className=ok?'pass':'fail';
        if(ok)passed++;
      }
    }else{
      lis.forEach(li=>li.className='fail');
      toast('В коде ошибка — читай вывод в консоли','bad');
    }
    badge.textContent=passed+'/'+l.tests.length;
    badge.classList.add(passed===l.tests.length?'ok':'bad');
    if(ctx.ok&&passed===l.tests.length)completeLesson(l);
  }
  RUN=doRun;CHECK=doCheck;

  $('#btnRun').onclick=doRun;
  $('#btnCheck').onclick=doCheck;
  $('#btnClear').onclick=()=>renderConsole($('#console-out'),null);
  $('#btnReset').onclick=()=>{currentEditor.set(l.start);delete STATE.drafts[l.id];saveState();renderConsole($('#console-out'),null);toast('Код сброшен','info')};
  $('#btnHint').onclick=()=>{const s=$('#hintSlot');if(s.innerHTML)return;
    s.innerHTML='<div class="hintbox"><b>💡 Подсказка:</b> '+l.hint+'</div>'};
  $('#btnSolution').onclick=()=>{
    if(!STATE.done[l.id]){toast('Сначала пройди урок — ты справишься! 💪','info');return}
    currentEditor.set(l.solution);toast('Решение загружено в редактор','info')};
  if(prev)$('#btnPrev').onclick=()=>location.hash='#/lesson/'+prev.id;
  if(next)$('#btnNext').onclick=()=>location.hash='#/lesson/'+next.id;
  else $('#btnNext').onclick=()=>{location.hash='#/';if(allDone())setTimeout(openCert,400)};

  /* мобильные вкладки */
  $$('.mtabs button').forEach(b=>b.onclick=()=>{
    $$('.mtabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('#lessonRoot').dataset.view=b.dataset.v;
    window.scrollTo({top:0});
    if(b.dataset.v==='code')setTimeout(()=>currentEditor&&currentEditor.focus(),100);
  });
  /* авто-переход на код на мобильных при запуске */
  const origRun=doRun;RUN=async()=>{if(innerWidth<=860){switchView('code')}await origRun()};

  /* растяжка панелей */
  const root=$('#lessonRoot'),hd=$('#splitHandle');
  hd.addEventListener('pointerdown',e=>{hd.classList.add('on');hd.setPointerCapture(e.pointerId);
    const mv=ev=>{const r=root.getBoundingClientRect();const sb=innerWidth>1200?264:0;
      let pct=(ev.clientX-r.left-sb)/(r.width-sb)*100;pct=Math.max(28,Math.min(62,pct));
      root.style.setProperty('--info',pct+'%')};
    const up=()=>{hd.classList.remove('on');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
}
function switchView(v){
  const r=$('#lessonRoot');if(!r)return;
  r.dataset.view=v;
  $$('.mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}

function completeLesson(l){
  if(STATE.done[l.id]){toast('Все тесты пройдены! ✅','good');return}
  STATE.done[l.id]=1;STATE.xp+=l.xp;saveState();
  updateHeader(true);
  refreshSidebar();
  const badge=$('#testsBadge');
  toast('Урок пройден! +'+l.xp+' XP ⚡','good');
  confetti();
  const sol=$('#btnSolution');if(sol)sol.title='Показать решение';
  const nx=$('#btnNext');if(nx&&!nx.disabled)nx.classList.add('pulse');
  const info=$('.pane-info');
  if(info&&!$('.done-banner',info))$('.lesson-nav',info).insertAdjacentHTML('beforebegin','<div class="done-banner">✅ Отлично! Урок пройден. +'+l.xp+' XP</div>');
  if(allDone())setTimeout(()=>{confetti();openCert(true)},1100);
}

/* ---------- сайдбар ---------- */
function sidebarHTML(active){
  const pc=Math.round(doneCount()/TOTAL*100);
  let h='<div class="sb-prog"><div class="lbl"><span>Прогресс курса</span><span>'+doneCount()+'/'+TOTAL+'</span></div><div class="sb-bar"><i style="width:'+pc+'%"></i></div></div>';
  COURSE.forEach(m=>{

function bindSidebar(scope){

function refreshSidebar(){const sb=$('#sidebar');if(sb&&currentLesson){sb.innerHTML=sidebarHTML(currentLesson);bindSidebar(sb)}}
function closeSidebar(){const sb=$('#sidebar');if(sb){sb.classList.remove('open');$('#sbBackdrop').classList.remove('show')}}

/* ---------- вид: главная ---------- */
let typerToken=0;
function cancelTyper(){typerToken++}
function renderHome(){
  currentLesson=null;RUN=CHECK=null;
  document.body.classList.remove('view-lesson');

  $('#app').innerHTML=`

    <div class="home-top">
      <div class="terminal reveal">
        <div class="term-head"><i></i><i></i><i></i><span>pycamp — python3</span></div>

        <div class="stat-grid">
          <div class="stat"><b>${COURSE.length}</b><span>модулей</span></div>
          <div class="stat"><b>${TOTAL}</b><span>уроков</span></div>
          <div class="stat"><b>${TOTAL_TESTS}</b><span>автотестов</span></div>

        </div>
        <div class="home-ctas">
          <button class="btn primary big" id="ctaMain">${dc>0?'▶ Продолжить обучение':'🚀 Начать бесплатно'}</button>
          <a class="btn ghost big" href="#/playground">⌨ Песочница</a>
        </div>
        <p style="margin-top:14px;font-size:13px;color:var(--faint)">Пройдено ${dc} из ${TOTAL} уроков (${pc}%) · максимально можно получить ${MAX_XP} XP</p>
      </div>
    </div>

      <div class="tile t-d reveal" style="--d:80ms"><span class="ico">💾</span><h3>Прогресс сохраняется</h3><p>Черновики кода и достижения хранятся в твоём браузере — можно вернуться в любой момент.</p></div>
      <div class="tile t-e reveal" style="--d:160ms"><span class="ico">🎓</span><h3>Финал — сертификат</h3><p>Пройди все ${TOTAL} уроков и получи именной сертификат (его можно распечатать).</p></div>

const TERM_LINES=[
 ['com','# запуск карьеры…'],
 ['code','name = "будущий разработчик"'],
 ['code','skills = ["Python", "упорство"]'],
 ['code','for s in skills:'],
 ['code','    print("загружаю:", s)'],
 ['out','загружаю: Python'],
 ['out','загружаю: упорство'],
 ['code','print(name + ", добро пожаловать в PyCamp!")'],
 ['out','будущий разработчик, добро пожаловать в PyCamp!'],
];
async function startTyper(){
  const my=++typerToken,body=$('#termBody');if(!body)return;
  const lines=TERM_LINES.concat();let loop=0;
  while(my===typerToken){
    body.innerHTML='';loop++;
    for(const [type,text] of lines){
      if(my!==typerToken)return;
      const div=document.createElement('div');
      div.className='tl-'+type;body.appendChild(div);
      if(type==='out'){await sleep(260);div.textContent=text;body.appendChild(mkCur());await sleep(430)}
      else{
        body.appendChild(mkCur());
        for(let i=1;i<=text.length;i++){
          if(my!==typerToken)return;
          div.textContent=text.slice(0,i);
          await sleep(type==='com'?14:22);
        }
        if(type==='code')div.innerHTML='<span class="tl-in"><b>&gt;&gt;&gt;</b></span> '+highlight(text);
      }
      const old=$('.cur',body);if(old)old.remove();
    }
    body.insertAdjacentHTML('beforeend','<div><span class="tl-in"><b>&gt;&gt;&gt;</b></span> <span class="cur"></span></div>');
    await sleep(loop===1?7000:12000);
  }
}
function mkCur(){const s=document.createElement('span');s.className='cur';return s}

/* ---------- вид: песочница ---------- */
const PLAY_START='# Песочница PyCamp 🐍\n# Пиши любой код на Python и жми «Запустить» (или Ctrl+Enter)\n\ndef fib(n):\n    a, b = 1, 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return a\n\nprint("Первые числа Фибоначчи:")\nprint([fib(i) for i in range(1, 11)])\n';
function renderPlayground(){
  currentLesson=null;CHECK=null;
  document.body.classList.remove('view-lesson');
  document.title='Песочница — PyCamp';
  cancelTyper();
  $('#app').innerHTML=`
  <div class="play">
    <h1>⌨ Песочница <span>Python</span></h1>
    <div class="editor-card">
      <div class="ed-head">
        <span class="ed-file"><i id="statusDot"></i> playground.py</span>

  currentEditor=createEditor($('#editorMount'),STATE.drafts.__play||PLAY_START,debounce(v=>{STATE.drafts.__play=v;saveState()},600));
  renderConsole($('#console-out'),null);
  RUN=async()=>{
    $('#statusDot').className='busy';renderConsole($('#console-out'),null,true);

    $('#statusDot').className=ctx.ok?'':'err';
  };
  $('#btnRun2').onclick=RUN;
  $('#btnClear2').onclick=()=>currentEditor.set('');
  $('#btnClear').onclick=()=>renderConsole($('#console-out'),null);
}

/* ---------- шапка, тосты, эффекты ---------- */
function updateHeader(pop){
  $('#xpVal').textContent=STATE.xp;
  const pc=doneCount()/TOTAL;
  $('#ringFg').style.strokeDashoffset=100.53*(1-pc);
  $('#ringTxt').textContent=Math.round(pc*100)+'%';
  if(pop){const p2=$('#xpPill');p2.classList.remove('pop');void p2.offsetWidth;p2.classList.add('pop')}
}
function toast(msg,kind){
  const t=document.createElement('div');
  t.className='toast '+(kind||'');t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2800);
}
function confetti(){
  const colors=['#ffd43b','#4b9be8','#3ddc84','#ff6b81','#b48cff','#4dd0e1'];
  for(let i=0;i<90;i++){
    const c=document.createElement('i');c.className='confetto';
    const s=6+Math.random()*7;
    c.style.cssText='left:'+Math.random()*100+'vw;width:'+s+'px;height:'+(s*1.4)+'px;background:'+colors[i%colors.length]+
      ';transform:rotate('+Math.random()*360+'deg)';
    document.body.appendChild(c);
    c.animate([{transform:'translateY(-20px) rotate(0deg)',opacity:1},
      {transform:'translateY(105vh) rotate('+(360+Math.random()*720)+'deg)',opacity:.9}],
      {duration:1600+Math.random()*1600,easing:'cubic-bezier(.2,.6,.4,1)',delay:Math.random()*350})
      .onfinish=()=>c.remove();
  }
}
let revealObs=null;
function observeReveals(){
  if(revealObs)revealObs.disconnect();
  revealObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revealObs.unobserve(e.target)}}),{threshold:.12});
  $$('.reveal:not(.in)').forEach(el=>revealObs.observe(el));
}

/* ---------- сертификат ---------- */
function openCert(invite){
  const complete=allDone();
  if(!complete&&!invite){toast('Пройди все '+TOTAL+' уроков, чтобы открыть сертификат ('+doneCount()+'/'+TOTAL+')','info');location.hash='#/';return}
  const d=new Date();
  const date=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const id='PY-'+Math.random().toString(36).slice(2,8).toUpperCase();
  document.body.classList.add('cert-print');
  $('#modal-root').innerHTML=`
  <div class="modal-overlay" id="certOverlay">
    <div class="cert">
      <span class="snake-wm">🐍</span>
      <div class="cert-logo">🐍 PYCAMP</div>
      <h2>СЕРТИФИКАТ</h2>
      <p class="cert-sub">настоящим подтверждает, что</p>
      <input id="certName" maxlength="40" placeholder="введи своё имя" value="${esc(STATE.name||'')}">
      <p class="cert-sub">успешно ${complete?'прошёл(ла)':'почти прошёл(ла)'} полный</p>
      <h3>Интерактивный курс Python</h3>
      <p class="cert-sub" style="font-size:12px">${complete?TOTAL+' уроков · '+TOTAL_TESTS+' автотестов · '+STATE.xp+' XP':'⚠ до завершения осталось уроков: '+(TOTAL-doneCount())}</p>
      <div class="cert-meta"><span>📅 ${date}</span><span>№ ${id}</span></div>
      <div class="cert-sign">наставник-интерпретатор PyCamp · автограф поставлен кодом</div>
      <div class="cert-actions no-print">
        <button class="btn primary small" id="certPrint">🖨 Печать</button>
        <button class="btn ghost small" id="certClose" style="color:#445;border-color:#ccc">Закрыть</button>
      </div>
    </div>
  </div>`;
  $('#certName').oninput=e=>{STATE.name=e.target.value;saveState()};
  $('#certPrint').onclick=()=>window.print();
  $('#certClose').onclick=closeCert;
  $('#certOverlay').onclick=e=>{if(e.target.id==='certOverlay')closeCert()};
  if(invite&&complete)confetti();
}
function closeCert(){$('#modal-root').innerHTML='';document.body.classList.remove('cert-print')}

/* ---------- роутер и инициализация ---------- */
function setNav(key){$$('.mainnav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===key))}
function route(){
  cancelTyper();closeCert();closeSidebar();
  const h=location.hash||'#/';
  if(h==='#/certificate'){openCert();if(history.replaceState)history.replaceState(null,'','#/');setNav('cert');return}
  if(h==='#/playground'){setNav('play');renderPlayground()}
  else if(h.startsWith('#/lesson/')){
    const l=findLesson(h.slice(9));
    if(l){setNav('');renderLesson(l);bindSidebar($('#sidebar'));$('#app').scrollTop=0;window.scrollTo(0,0)}
    else{setNav('home');renderHome()}
  }else{setNav('home');renderHome()}
}
$('#certLink').addEventListener('click',e=>{if(!allDone()){e.preventDefault();openCert()}});
$('#btnSb').onclick=()=>{const sb=$('#sidebar');if(sb){sb.classList.toggle('open');$('#sbBackdrop').classList.toggle('show',sb.classList.contains('open'))}};
$('#sbBackdrop').onclick=closeSidebar;
addEventListener('hashchange',route);
updateHeader();
