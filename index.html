<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #58a6ff;
            font-size: 1.8rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background: #1f2937;
            border-color: #58a6ff;
            color: #58a6ff;
            transform: translateX(4px);
        }

        nav a .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Projects</h1>
        <nav>
            <a href="alice_ai.html">
                <span class="icon">📄</span> Alice AI
            </a>
            <a href="cursor.html">
                <span class="icon">📄</span> Cursor
            </a>
            <a href="deepseek.html">
                <span class="icon">📄</span> DeepSeek
            </a>
            <a href="qwen_web.html">
                <span class="icon">📄</span> Qwen Web
            </a>
            <a href="z.ai.html">
                <span class="icon">📄</span> Z.AI
            </a>
        </nav>
    </div>
</body>
</html>
